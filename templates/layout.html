<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}ScalpAid{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cream: '#FFFDD0',
              sage: {
                light: '#9CAF88',
                DEFAULT: '#8FA97A',
                dark: '#7f9770'
              },
              beige: '#F5F5DC'
            }
          }
        }
      }
    </script>
</head>
<body class="bg-cream min-h-screen flex flex-col">

    <!-- Top Nav -->
    <nav class="bg-sage text-white px-6 py-4 flex justify-between items-center shadow-md">
        <div class="font-bold text-2xl">ScalpAid</div>
       <ul class="hidden md:flex gap-6 font-medium">

    <!-- Always visible -->
    <li><a href="{{ url_for('home') }}" class="hover:underline">Home</a></li>

    {% if session.get('user_id') %}
        <!-- LOGGED-IN NAV -->
        <li><a href="{{ url_for('dashboard') }}" class="hover:underline">Dashboard</a></li>
        <li><a href="{{ url_for('profile') }}" class="hover:underline">Profile</a></li>
        <li><a href="{{ url_for('insights') }}" class="hover:underline">Insights</a></li>
        <li><a href="{{ url_for('history') }}" class="hover:underline">History</a></li>
        <li><a href="{{ url_for('logout') }}" class="hover:underline">Logout</a></li>
         <aside class="w-full md:w-64 bg-sage-light/10 border-r border-beige p-4 space-y-2">
            <a href="{{ url_for('dashboard') }}" class="block p-2 rounded hover:bg-sage-light text-sage-dark font-medium">Overview</a>
            <a href="{{ url_for('sensor_data') }}" class="block p-2 rounded hover:bg-sage-light text-sage-dark font-medium">Sensor Data</a>
        </aside>

    {% else %}
        <!-- LOGGED-OUT NAV -->
        {% if users_exist %}
            <!-- Registered user → Hide register -->
            <li><a href="{{ url_for('login') }}" class="hover:underline">Login</a></li>
        {% else %}
            <!-- First time user → Show register -->
            <li><a href="{{ url_for('register') }}" class="hover:underline">Register</a></li>
            <li><a href="{{ url_for('login') }}" class="hover:underline">Login</a></li>
        {% endif %}
    {% endif %}
</ul>

        <button class="md:hidden p-2 bg-sage-dark rounded-lg">Menu</button>
    </nav>

    <!-- Dashboard Shell -->
    <div class="flex flex-1 flex-col md:flex-row">

        <!-- Sidebar -->
       

        <!-- Main Content -->
        <main class="flex-1 p-6 space-y-6">
            {% block content %}
            {% endblock %}
        </main>
    </div>
<!-- GLOBAL PUBNUB SCRIPT (available on every page) -->
<script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.0.min.js"></script>

<script>
    const pubnub = new PubNub({
        subscribeKey: "sub-c-965e4329-6565-4fba-bb02-05774be3a3c3",
        uuid: "flask-client"
    });

    pubnub.subscribe({ channels: ["scalp_data"] });

    pubnub.addListener({
        message: function(event) {
            const d = event.message;

            // SAFELY update ANY element on ANY page
            function update(id, value) {
                const el = document.getElementById(id);
                if (el) el.textContent = value;
            }

            update("temp", d.temperature?.toFixed(2) + " °C");
            update("temp-value", d.temperature?.toFixed(2));  // For chart page

            update("moist", d.moisture_percent?.toFixed(1) + "%");
            update("moisture-value", d.moisture_percent?.toFixed(1)); // For chart page

            update("volt", d.moisture_voltage?.toFixed(3) + " V");
            update("raw", d.moisture_raw);
            update("state", d.state);

            if (d.timestamp) {
                const ts = new Date(d.timestamp * 1000);
                update("updated", ts.toLocaleTimeString());
                update("time", ts.toLocaleTimeString());
            }

            // Update chart if present
            if (window.sensorChart) {
                sensorChart.data.labels.push(new Date().toLocaleTimeString());
                sensorChart.data.datasets[0].data.push(d.temperature);
                sensorChart.data.datasets[1].data.push(d.moisture_percent);
                sensorChart.update();
            }
        }
    });
</script>

</body>
</html>
