<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}ScalpAid{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cream: '#FFFDD0',
              sage: {
                light: '#9CAF88',
                DEFAULT: '#8FA97A',
                dark: '#7f9770'
              },
              beige: '#F5F5DC'
            }
          }
        }
      }
    </script>
</head>
<body class="bg-cream min-h-screen flex flex-col">

    <!-- Top Nav -->
    <nav class="bg-sage text-white px-6 py-4 flex justify-between items-center shadow-md">
        <div class="font-bold text-2xl">ScalpAid</div>
        <ul class="hidden md:flex gap-6 font-medium">
            <li><a href="{{ url_for('home') }}" class="hover:underline">Home</a></li>
            <li><a href="{{ url_for('register') }}" class="hover:underline">Register</a></li>
            <li><a href="{{ url_for('login') }}" class="hover:underline">Login</a></li>
            <li><a href="{{ url_for('dashboard') }}" class="hover:underline">Dashboard</a></li>
            <li><a href="{{ url_for('profile') }}" class="hover:underline">Profile</a></li>
            <li><a href="{{ url_for('insights') }}" class="hover:underline">Insights</a></li>
            <li><a href="{{ url_for('logout') }}" class="hover:underline">Logout</a></li>
        </ul>
        <button class="md:hidden p-2 bg-sage-dark rounded-lg">Menu</button>
    </nav>

    <!-- Dashboard Shell -->
    <div class="flex flex-1 flex-col md:flex-row">

        <!-- Sidebar -->
        <aside class="w-full md:w-64 bg-sage-light/10 border-r border-beige p-4 space-y-2">
            <a href="{{ url_for('dashboard') }}" class="block p-2 rounded hover:bg-sage-light text-sage-dark font-medium">Overview</a>
            <a href="{{ url_for('sensor_data') }}" class="block p-2 rounded hover:bg-sage-light text-sage-dark font-medium">Sensor Data</a>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-6 space-y-6">
            {% block content %}
            {% endblock %}
        </main>
    </div>

</body>
</html>
