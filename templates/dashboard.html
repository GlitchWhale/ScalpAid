{% extends "layout.html" %}
{% block content %}

<h1 class="text-2xl font-bold text-sage-dark">Live Sensor Dashboard</h1>

<div class="sensor-values">
    <p>Temperature: <span id="temp-value">--</span> °C</p>
    <p>Moisture: <span id="moisture-value">--</span> %</p>
</div>

<canvas id="sensorChart" width="600" height="300"></canvas>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    const ctx = document.getElementById('sensorChart').getContext('2d');

    window.sensorChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [
                { label: 'Temperature (°C)', data: [] },
                { label: 'Moisture (%)', data: [] }
            ]
        }
    });
</script>

{% endblock %}
