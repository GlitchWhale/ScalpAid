<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScalpAid – Settings</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="top-nav">
        <div class="logo" style="display: flex; align-items: center; gap: 10px">
          <img
            src="../images/Logo.png"
            alt="ScalpAid Logo"
            style="height: 60px; width: auto"
          />
          <span style="font-weight: 700; font-size: 1.5rem; color: #5e7554">
            ScalpAid
          </span>
        </div>
        <nav class="nav-links">
          <a href="home.html">Home</a>
          <a href="history.html">History</a>
          <a href="insights.html">Insights</a>
          <a href="settings.html" class="active">Settings</a>
          <a href="profile.html">Profile</a>
        </nav>
      </header>

      <main>
        <div class="card full-span">
          <div class="page-title">Settings</div>
          <div class="page-subtitle">
            Manage notifications and device connections.
          </div>
        </div>

        <div class="card">
          <div class="section-title">Notifications</div>
          <div class="settings-row">
            <span>Daily Summary</span>
            <button class="toggle-pill active">On</button>
          </div>
          <div class="settings-row">
            <span>Moisture Alerts</span>
            <button class="toggle-pill active">On</button>
          </div>
          <div class="settings-row">
            <span>Tension Alerts</span>
            <button class="toggle-pill">Off</button>
          </div>
        </div>

        <div class="card">
          <div class="section-title">Headband Connection</div>
          <div class="settings-row">
            <span>Device</span>
            <span style="font-size: 12px; color: var(--text-muted)"
              >Band 01</span
            >
          </div>
          <div class="settings-row">
            <span>Status</span>
            <button class="toggle-pill active">Connected</button>
          </div>
        </div>
      </main>

      <nav class="bottom-nav">
        <a href="home.html">Home</a>
        <a href="history.html">History</a>
        <a href="insights.html">Insights</a>
        <a href="settings.html" class="active">Settings</a>
        <a href="profile.html">Profile</a>
      </nav>
    </div>

    <script src="../js/script.js"></script>
  </body>
</html>
