<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScalpAid – Insights</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="insights-page">
    <div class="app-shell">
      <header class="top-nav">
        <div class="logo" style="display: flex; align-items: center; gap: 10px">
          <img
            src="../images/Logo.png"
            alt="ScalpAid Logo"
            style="height: 60px; width: auto"
          />
          <span style="font-weight: 700; font-size: 1.5rem; color: #5e7554">
            ScalpAid
          </span>
        </div>
        <nav class="nav-links">
          <a href="home.html">Home</a>
          <a href="history.html">History</a>
          <a href="insights.html" class="active">Insights</a>
          <a href="settings.html">Settings</a>
          <a href="profile.html">Profile</a>
          <a href="#" id="logoutBtn">Logout</a>
        </nav>
      </header>

      <main>
        <div class="card" style="grid-column: 1/-1">
          <div class="page-title">Insights</div>
          <div class="page-subtitle">
            Your scalp health analysis and care recommendations.
          </div>
        </div>

        <!-- Summary -->
        <div class="card">
          <div class="section-title">Summary</div>
          <p
            style="font-size: 14px; color: var(--text-muted)"
            id="insightSummary"
          >
            --
          </p>
        </div>

        <!-- Individual Insights -->
        <div class="card">
          <div class="section-title">Insights</div>
          <div class="insight-item">
            <div class="insight-text-title">Temperature</div>
            <div class="insight-text-body">--</div>
          </div>
          <div class="insight-item">
            <div class="insight-text-title">Moisture</div>
            <div class="insight-text-body">--</div>
          </div>
          <div class="insight-item">
            <div class="insight-text-title">Tension</div>
            <div class="insight-text-body">--</div>
          </div>
        </div>

        <!-- Recommendations -->
        <div class="card">
          <div class="section-title">Recommendations</div>
          <div class="insight-item">
            <div class="insight-text-title">Hydration Tip</div>
            <div class="insight-text-body">--</div>
          </div>
          <div class="insight-item">
            <div class="insight-text-title">Styling Tip</div>
            <div class="insight-text-body">--</div>
          </div>
        </div>
      </main>

      <nav class="bottom-nav">
        <a href="home.html">Home</a>
        <a href="history.html">History</a>
        <a href="insights.html" class="active">Insights</a>
        <a href="settings.html">Settings</a>
        <a href="profile.html">Profile</a>
      </nav>
    </div>

    <script src="../js/script.js"></script>
  </body>
</html>
