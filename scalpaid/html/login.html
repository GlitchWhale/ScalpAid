<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScalpAid – Login</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="top-nav">
    <div class="logo">ScalpAid</div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="login.html" class="active">Login</a>
      <a href="register.html">Register</a>
    </nav>
  </header>

  <main style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding-top:60px;">
    <div class="card" style="max-width:400px; width:100%;">
      <div class="page-title">Login</div>
      <p class="page-subtitle">Access your ScalpAid account.</p>

      <form id="loginForm">
        <input type="email" id="email" class="input-field" placeholder="Email" required />
        <input type="password" id="password" class="input-field" placeholder="Password" required />
        <button class="btn-primary" type="submit">Log In</button>
      </form>
    </div>
  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if(email && password){
        // Define demo Brianna user
        let user;
        if(email.toLowerCase() === "brianna@example.com"){
          user = {
            email: "brianna@example.com",
            name: "Briana Shen",
            username: "@brianashen",
            hairType: "Curly (3B)",
            hairTexture: "Medium-Thick",
            memberSince: "10/09/2024",
            temperature: 36.5,
            tension: 4,
            moisture: 62
          };
        } else {
          // Any other user: empty profile
          user = {
            email: email,
            name: "",
            username: "",
            hairType: "",
            hairTexture: "",
            memberSince: "",
            temperature: null,
            tension: null,
            moisture: null
          };
        }

        // Store in localStorage
        localStorage.setItem("loggedInUser", JSON.stringify(user));
        window.location.href = "home.html";

      } else {
        alert("Please enter valid credentials.");
      }
    });
  </script>
</body>
</html>
