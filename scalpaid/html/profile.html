<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScalpAid – Profile</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="app-shell">
  <header class="top-nav">
    <div class="logo">ScalpAid</div>
    <nav class="nav-links">
      <a href="home.html">Home</a>
      <a href="history.html">History</a>
      <a href="insights.html">Insights</a>
      <a href="settings.html">Settings</a>
      <a href="profile.html" class="active">Profile</a>
      <a href="#" id="logoutBtn">Logout</a>
    </nav>
  </header>

  <main class="profile-page">
    <section class="card full-span">
      <div class="page-title">Profile</div>
      <div class="page-subtitle">Your ScalpAid profile and health tracking overview.</div>
    </section>

    <section class="card">
      <div class="profile-header-row">
        <div class="profile-avatar" id="profileAvatar">--</div>
        <div class="profile-meta">
          <div class="profile-meta-label">ScalpAid Profile</div>
          <div class="profile-meta-name" id="profileName">--</div>
        </div>
      </div>

      <div class="profile-details-list" id="profileDetails">
        <div class="profile-detail-row">
          <span class="profile-detail-label">Username</span>
          <span class="profile-detail-value" id="profileUsername">--</span>
        </div>
        <div class="profile-detail-row">
          <span class="profile-detail-label">Hair Type</span>
          <span class="profile-detail-value" id="profileHairType">--</span>
        </div>
        <div class="profile-detail-row">
          <span class="profile-detail-label">Hair Texture</span>
          <span class="profile-detail-value" id="profileHairTexture">--</span>
        </div>
        <div class="profile-detail-row">
          <span class="profile-detail-label">Member Since</span>
          <span class="profile-detail-value" id="profileMemberSince">--</span>
        </div>
      </div>
      <button id="editProfileBtn">Edit Profile</button>
      <button id="saveProfileBtn" style="display:none;">Save</button>
    </section>
  </main>

  <nav class="bottom-nav">
    <a href="home.html">Home</a>
    <a href="history.html">History</a>
    <a href="insights.html">Insights</a>
    <a href="settings.html">Settings</a>
    <a href="profile.html" class="active">Profile</a>
  </nav>
</div>

<script src="../js/script.js"></script>
</body>
</html>
